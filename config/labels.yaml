        regex: "(?i)Good Morning Vietnam"
      - field: beguenstigter
        regex: "(?i)Cocolo Restaurant"
      - field: beguenstigter
        regex: "(?i)Yogi indischer imbiss/berlin"
      - field: beguenstigter
        regex: "(?i)Via He Hai Restaurant/Berlin"

versicherung:
  - name: zahnzusatzversicherung
    match: all
    rules:
      - field: beguenstigter
        regex: "(?i)Wuerttembergische Versicherung"
      - field: verwendungszweck
        regex: "(?i)Krankenvers"

sport:

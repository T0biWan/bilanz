    match: any
    rules:
      - field: beguenstigter
        regex: "(?i)Steam Games"
      - field: beguenstigter
        regex: "(?i)Humble Bundle"
      - field: beguenstigter
        regex: "(?i)GOG Sp. Z o.o."
      - field: beguenstigter
        regex: "(?i)GOG.com"
      - field: beguenstigter
        regex: "(?i)Mac/Win Game Store"

  - name: MTG
    match: any
    rules:
      - field: beguenstigter
        regex: "(?i)Games Island GmbH & Co KG"
      - field: beguenstigter
        regex: "(?i)Sammelkartenmarkt"

  - name: streaming
    match: any
    rules:
      - field: beguenstigter
        regex: "(?i)spotify"
      - field: beguenstigter
        regex: "(?i)netflix"
      - field: beguenstigter
        regex: "(?i)Audible"

haushalt:
  - name: it
    match: any
    rules:
      - field: beguenstigter
        regex: "(?i)Dynalist Inc." # Obsidian.md
      - field: beguenstigter
